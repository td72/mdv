# viw — vim-keyed viewer (markdown for now; see issue #4)
# Swift comes from the Apple toolchain (Xcode Command Line Tools); AppKit needs it, so it is not a mise tool.

[env]
VIW_APP = "build/viw.app"
VIW_BIN = ".build/release/viw"
VIW_PREFIX = "{{env.HOME}}/Applications"
VIW_BINDIR = "{{env.HOME}}/.local/bin"

[tasks.build]
description = "Release build (swift build -c release)"
alias = "b"
run = "swift build -c release"
sources = ["Package.swift", "Package.resolved", "Sources/**/*.swift"]
outputs = [".build/release/viw"]

[tasks.icon]
description = "Build build/viw.icns from Resources/icon-1024.png (sips + iconutil, no dependencies)"
sources = ["Resources/icon-1024.png"]
outputs = ["build/viw.icns"]
run = '''
set -euo pipefail
set="build/viw.iconset"
rm -rf "$set" && mkdir -p "$set"
for s in 16 32 128 256 512; do
  sips -z $s $s Resources/icon-1024.png --out "$set/icon_${s}x${s}.png" >/dev/null
  sips -z $((s*2)) $((s*2)) Resources/icon-1024.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
done
iconutil -c icns "$set" -o build/viw.icns
rm -rf "$set"
'''

[tasks.app]
description = "Assemble build/viw.app from the release binary"
depends = ["build", "icon"]
run = '''
set -euo pipefail
rm -rf "$VIW_APP"
mkdir -p "$VIW_APP/Contents/MacOS" "$VIW_APP/Contents/Resources"
cp "$VIW_BIN" "$VIW_APP/Contents/MacOS/viw"
cp Resources/Info.plist "$VIW_APP/Contents/Info.plist"
cp build/viw.icns "$VIW_APP/Contents/Resources/viw.icns"
# tree-sitter highlight queries (Bundle.module looks in Contents/Resources)
cp -R .build/release/CodeEditLanguages_CodeEditLanguages.bundle "$VIW_APP/Contents/Resources/"
codesign --force --sign - "$VIW_APP"
'''

[tasks.install]
description = "Copy viw.app to ~/Applications and symlink the CLI into ~/.local/bin"
depends = ["app"]
run = '''
set -euo pipefail
rm -rf "$VIW_PREFIX/viw.app" "$VIW_PREFIX/mdv.app"   # mdv.app: the pre-rename install
rm -f "$VIW_BINDIR/mdv"
mkdir -p "$VIW_PREFIX" "$VIW_BINDIR"
cp -R "$VIW_APP" "$VIW_PREFIX/viw.app"
ln -sf "$VIW_PREFIX/viw.app/Contents/MacOS/viw" "$VIW_BINDIR/viw"
echo "installed: $VIW_PREFIX/viw.app  (cli: $VIW_BINDIR/viw)"
'''

[tasks.run]
description = "Build and open a markdown file (default: examples/sample.md)"
depends = ["build"]
usage = '''
arg "[file]" help="Markdown file to open" default="examples/sample.md"
'''
run = '"$VIW_BIN" "${usage_file}"'

[tasks.snapshot]
description = "Render a file to a PNG (debug) — mise r snapshot [file] [-o out.png] [--dark] [--width N]"
depends = ["build"]
usage = '''
arg "[file]" help="Markdown file" default="examples/sample.md"
flag "-o --out <path>" help="Output PNG" default="build/snapshot.png"
flag "--dark" help="Force dark appearance"
flag "--width <pt>" help="Text view width in points"
'''
run = '''
set -euo pipefail
mkdir -p "$(dirname "${usage_out}")"
export VIW_SNAPSHOT="${usage_out}"
[ -n "${usage_width:-}" ] && export VIW_SNAPSHOT_WIDTH="${usage_width}"
[ "${usage_dark:-}" = "true" ] && export VIW_DARK=1
"$VIW_BIN" "${usage_file}"
echo "wrote ${usage_out}"
'''

[tasks.test]
description = "Run the logic tests (swift-testing); the plugin path makes it work with the Command Line Tools too"
alias = "t"
run = """
set -euo pipefail
plugins="$(dirname "$(dirname "$(xcrun -f swift)")")/lib/swift/host/plugins/testing"
swift test -Xswiftc -plugin-path -Xswiftc "$plugins" "$@"
"""

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf .build build"
